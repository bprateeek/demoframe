title: shipcheck readme-loop baseline
output:
  format: webp
  width: 720
  displayWidth: 480
  fps: 15
  budget: 5MB
  quality: standard
theme:
  preset: github-dark
  accent: "#f6b73c"
  palette:
    success: "#35d07f"
frame:
  type: terminal
  width: 960
  height: 600
  title: shipcheck · release gate
  prompt: "$"
brief:
  mode: inferred
  audience: Maintainers evaluating a release-check CLI in a README
  source: eval/fixtures/cli-tool/README.md commands, checklist copy, and exit behavior
  screenshotPolicy: reconstruct
  placement: github-readme
  arc: Find the two open release checks, close them, and land on a green ship gate
  climax: shipcheck reports 3/3 complete and ready to ship
  brand: { accent: "#f6b73c", frame: terminal, mode: dark }
  product: shipcheck
  repo: shipcheck
  verbatimCopy: ["shipcheck run", "ready to ship"]
  assumptions:
    - Benchmark baseline uses the checked-in fixture README as its source of truth.
scenes:
  - type: terminal-playback
    duration: 3.4
    command: shipcheck run
    spinner: Reading .shipcheck.json
    output:
      - { text: "shipcheck: 1/3 checks complete", style: warn }
      - "  blocking: #2 update CHANGELOG.md"
      - "  blocking: #3 smoke test the installer"
    exit: { status: error, label: blocked }
    cinematic: { motion: settle }
  - type: terminal-playback
    duration: 3.2
    command: shipcheck done 2 && shipcheck done 3
    output:
      - { text: "completed #2 update CHANGELOG.md", style: dim }
      - { text: "completed #3 smoke test the installer", style: dim }
    exit: { status: success, label: checklist updated }
    cinematic: { motion: float-in }
  - type: status-card
    duration: 2.4
    title: 3/3 complete · ready to ship
    subtitle: shipcheck release gate
    checks: [Full test suite, CHANGELOG.md, Installer smoke test]
    cta: { label: Ship release, style: success }
    cinematic: { composition: macro-card, motion: dolly-in }
  - type: hold
    duration: 1.2
    celebrate: true
