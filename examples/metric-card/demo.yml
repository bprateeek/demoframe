title: Metric card demo
output: { format: gif, width: 600, fps: 15, displayWidth: 420 }
theme: { accent: "#1f9d55", mode: light, font: inter }
frame: { type: browser, title: Weekly report }
brief:
  audience: README visitors checking metric-card animation
  source: Synthetic report.json metrics reconstructed as a browser card
  screenshotPolicy: reconstruct
  placement: github-readme
  arc: Reveal the 30-day render metrics, animate the chart, then hold on the report
  climax: Renders, encode time, and budget rate are readable together
  brand: { accent: "#1f9d55", frame: browser, mode: light }
  product: demoframe
  repo: bprateeek/demoframe
  verbatimCopy: ["Last 30 days", "Numbers from report.json"]
scenes:
  - type: metric-card
    duration: 6
    title: Last 30 days
    metrics:
      - { label: Renders, value: 12840 }
      - { label: Median encode, value: 3.4, suffix: s, decimals: 1 }
      - { label: Within budget, value: 98, suffix: "%" }
    chart:
      kind: bar
      series: [4, 7, 6, 11, 14, 18, 23]
      labels: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
    caption: Numbers from report.json
  - type: hold
    duration: 1.2
