title: Fieldwork mobile to pull request demo
output: { format: gif, width: 480, fps: 15, budget: 5MB, displayWidth: 280, motionBlur: off }
theme: { accent: "#e2603a", mode: light, font: inter }
frame: { type: phone, title: vps-fieldwork-smoke, subtitle: "fieldwork-smoke · VPS" }
brief:
  mode: user-confirmed
  audience: README visitors evaluating a mobile-to-PR agent story
  source: Synthetic flow reconstructed from fieldwork and GitHub handoff screens
  screenshotPolicy: reconstruct
  placement: github-readme
  arc: Ask for a helper, verify the VPS workspace, then open the pull request
  climax: The release-notes helper PR is ready for review
  brand: { accent: "#e2603a", frame: phone, mode: light }
  product: fieldwork
  repo: fieldwork-smoke
  verbatimCopy: ["Merge pull request", "Awaiting human review"]
scenes:
  - type: typing
    duration: 3.8
    cinematic: { composition: center-hero, motion: float-in, ambient: ember }
    text: "Add a tiny release-notes helper with a basic test"
    send: true
  - type: steps
    duration: 3.6
    cinematic: { composition: center-hero, motion: float-in }
    header: { title: Workspace ready, detail: "VPS connected. Pull requests open for review." }
    items:
      - { label: Verification passed, detail: "Read files, created a basic test +3 -0", state: done }
      - { label: Prepare succeeded, detail: "Branch prepared for broker submission", state: done }
      - { label: Opening pull request, detail: "fieldwork/mobile-release-notes-helper", state: active, link: true }
      - { label: PR ready for review, detail: "fieldwork-smoke #12", state: done }
  - type: status-card
    duration: 3.0
    cinematic: { composition: center-hero, motion: float-in }
    transition: crossfade
    title: Add release notes helper
    subtitle: "fieldwork / fieldwork-smoke #12"
    branch: { from: fieldwork/mobile-release-notes-helper, into: main }
    checks: [Checks passed, Ready for review]
    cta: { label: Merge pull request, style: success }
    caption: Awaiting human review
  - type: hold
    duration: 1.4
