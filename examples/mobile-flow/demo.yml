title: Fieldwork mobile pull request flow
output: { format: gif, width: 480, fps: 15, budget: 5MB, displayWidth: 280 }
theme: { accent: "#e2603a", mode: light, font: inter }
frame: { type: phone, title: vps-fieldwork-smoke, subtitle: "fieldwork-smoke · VPS" }
brief:
  mode: user-confirmed
  audience: README visitors evaluating a mobile agent workflow
  source: Synthetic pull-request flow reconstructed from fieldwork status screens
  screenshotPolicy: reconstruct
  placement: github-readme
  arc: Ask for a README change, verify the work, then open a reviewed PR
  climax: The health probe PR is ready with passing checks
  brand: { accent: "#e2603a", frame: phone, mode: light }
  product: fieldwork
  repo: fieldwork-smoke
  verbatimCopy: ["Merge pull request", "docs: add health probe section to README"]
scenes:
  - type: typing
    duration: 2.8
    text: "Add a health probe section to the README"
    send: true
  - type: chat
    duration: 3.2
    transition: crossfade
    avatars:
      assistant: { initials: CC, color: "#e2603a" }
      user: { initials: PB, color: "#3b6cf2" }
    messages:
      - { role: assistant, text: "Verification passed. Opening a pull request." }
      - { role: user, text: "Great, get it ready for review." }
  - type: steps
    duration: 3.0
    header: { title: Workspace ready, detail: "VPS connected. Pull requests open for review." }
    items:
      - { label: Verification passed, detail: "Read a file, created a file +8 -0", state: done }
      - { label: Prepare succeeded, detail: "Branch prepared for broker submission", state: done }
      - { label: PR ready for review, detail: "fieldwork-smoke #18", state: done }
  - type: status-card
    duration: 2.8
    transition: crossfade
    title: "docs: add health probe section to README"
    subtitle: "bprateeek / fieldwork-smoke #18"
    branch: { from: fieldwork/add-health-probe, into: main }
    checks: [Checks passed, Ready for review]
    cta: { label: Merge pull request, style: success }
  - type: hold
    duration: 1.2
    celebrate: true
