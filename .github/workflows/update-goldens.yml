name: Update goldens

on:
  workflow_dispatch:

jobs:
  update-goldens:
    name: Regenerate goldens (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: node dist/cli.js install-browser

      - name: Regenerate goldens
        run: UPDATE_GOLDEN=1 UPDATE_LEGACY_BASELINE=1 npx vitest run src/golden.test.ts src/legacyExact.test.ts

      - uses: actions/upload-artifact@v4
        with:
          name: golden-frames
          path: test/golden/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: legacy-exact-1.0.1
          path: test/legacy-exact/
          if-no-files-found: error
